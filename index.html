<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basketball Score Sheet Reader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Basketball Score Sheet Scanner</h1>
  <input type="file" accept="image/*" capture="environment" id="upload" />
  <button onclick="processImage()">Extract Data</button>
  <div id="loading">Processing image...</div>
  <canvas id="preview"></canvas>
  
  <h2>Team A</h2>
  <table id="teamA" class="score-table">
    <thead>
      <tr><th>Number</th><th>Name</th><th>Points</th><th>Fouls</th><th>Technicals</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Team B</h2>
  <table id="teamB" class="score-table">
    <thead>
      <tr><th>Number</th><th>Name</th><th>Points</th><th>Fouls</th><th>Technicals</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.1/dist/tesseract.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
